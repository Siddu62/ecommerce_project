<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShop - Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f4f7;
      font-family: "Poppins", sans-serif;
    }
    .navbar {
      background-color: #232f3e;
    }
    .navbar-brand {
      color: #ff9900 !important;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .nav-link {
      color: #fff !important;
      margin-right: 15px;
    }
    .nav-link:hover {
      color: #ff9900 !important;
    }
    .cart-container {
      margin-top: 40px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }
    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }
    .btn-remove {
      color: red;
      border: none;
      background: transparent;
    }
    .btn-checkout {
      background-color: #ff9900;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
    }
    .btn-checkout:hover {
      background-color: #ffa31a;
    }
  </style>
</head>
<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="/">MyShop</a>
    <div class="ms-auto">
      <a class="nav-link d-inline" href="/">Home</a>
      <a class="nav-link d-inline" href="/cart/">Cart</a>
      <a class="nav-link d-inline" href="/admin/login/">Admin</a>
    </div>
  </nav>

  <div class="container cart-container">
    <h3 class="mb-4 text-center"><i class="fa-solid fa-cart-shopping"></i> Your Cart</h3>
    <div id="cartItems"></div>
    <h4 class="mt-4 text-end">Total: ₹<span id="totalAmount">0</span></h4>
    <div class="text-end mt-3">
      <button class="btn btn-danger me-2" onclick="clearCart()">Clear Cart</button>
      <button class="btn btn-checkout" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cartItems");
      let total = 0;
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-muted">🛒 Your cart is empty.</p>`;
        document.getElementById("totalAmount").innerText = 0;
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        container.innerHTML += `
          <div class="row cart-item align-items-center">
            <div class="col-md-2">
              <img src="${item.image_url || 'https://via.placeholder.com/100x100?text=No+Image'}" alt="${item.name}">
            </div>
            <div class="col-md-4">
              <h6>${item.name}</h6>
              <p class="text-muted small">${item.category}</p>
            </div>
            <div class="col-md-2 text-center">
              <button class="btn btn-sm btn-secondary" onclick="updateQuantity(${index}, -1)">-</button>
              <span class="mx-2">${item.quantity}</span>
              <button class="btn btn-sm btn-secondary" onclick="updateQuantity(${index}, 1)">+</button>
            </div>
            <div class="col-md-2 text-danger fw-bold">₹${itemTotal.toFixed(2)}</div>
            <div class="col-md-2 text-end">
              <button class="btn-remove" onclick="removeItem(${index})"><i class="fa fa-trash"></i></button>
            </div>
          </div>
        `;
      });

      document.getElementById("totalAmount").innerText = total.toFixed(2);
    }

    function updateQuantity(index, change) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart[index].quantity += change;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    function clearCart() {
      localStorage.removeItem("cart");
      loadCart();
    }

    function checkout() {
      alert("✅ Checkout Successful! Thank you for shopping with us.");
      clearCart();
    }

    loadCart();
  </script>
</body>
</html>
