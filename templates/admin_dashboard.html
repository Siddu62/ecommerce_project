<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3>Dashboard</h3>
    <div id="stats" class="row my-3"></div>
    <div>
      <a class="btn btn-primary" href="/admin/products/">Products</a>
      <a class="btn btn-secondary" href="/admin/orders/">Orders</a>
    </div>
  </div>

<script>
async function loadStats(){
  const token = localStorage.getItem('access');
  const res = await fetch('/api/products/admin/dashboard-stats/', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if(!res.ok) { if(res.status===401||res.status===403) window.location='/admin/login/'; return; }
  const d = await res.json();
  document.getElementById('stats').innerHTML = `
    <div class="col-md-3"><div class="card p-2">Total Orders: ${d.total_orders}</div></div>
    <div class="col-md-3"><div class="card p-2">Pending Orders: ${d.pending_orders}</div></div>
    <div class="col-md-3"><div class="card p-2">Total Revenue: ${d.total_revenue}</div></div>
    <div class="col-md-3"><div class="card p-2">Products: ${d.total_products}</div></div>
  `;
}
loadStats();
</script>
</body>
</html>
