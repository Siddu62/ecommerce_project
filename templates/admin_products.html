<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3>Products</h3>
    <button class="btn btn-success mb-3" onclick="location.href='/admin/products/new/'">Add Product</button>
    <table class="table" id="productsTable">
      <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
async function loadProducts(){
  const token = localStorage.getItem('access');
  const res = await fetch('/api/products/?page=1', {headers: {'Authorization':'Bearer ' + token}});
  const data = await res.json();
  const tbody = document.querySelector('#productsTable tbody');
  tbody.innerHTML = '';
  (data.results || data).forEach(p => {
    tbody.innerHTML += `<tr>
      <td>${p.images ? '<img src="'+p.images+'" width="50"/>' : ''}</td>
      <td>${p.name}</td>
      <td>${p.price}</td>
      <td>${p.stock}</td>
      <td>${p.category}</td>
      <td>
        <a href="/admin/products/new/?id=${p.id}" class="btn btn-sm btn-primary">Edit</a>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
      </td>
    </tr>`;
  });
}

async function deleteProduct(id){
  if(!confirm('Delete product?')) return;
  const token = localStorage.getItem('access');
  const res = await fetch('/api/products/' + id + '/', {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + token }
  });
  if (res.status === 204) loadProducts();
  else alert('Failed to delete');
}

loadProducts();
</script>
</body>
</html>
