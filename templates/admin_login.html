<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container" style="max-width:420px;">
    <h3>Admin Login</h3>
    <div id="alert"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label>Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button class="btn btn-primary">Sign In</button>
    </form>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login/', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (res.ok) {
    localStorage.setItem('access', data.access);
    localStorage.setItem('refresh', data.refresh);
    const profileRes = await fetch('/api/auth/profile/', {headers: {'Authorization': 'Bearer ' + data.access}});
    const profile = await profileRes.json();
    if (profile.role === 'admin') {
      window.location = '/admin/dashboard/';
    } else {
      document.getElementById('alert').innerHTML = '<div class="alert alert-danger">Not an admin</div>';
    }
  } else {
    document.getElementById('alert').innerHTML = '<div class="alert alert-danger">' + (data.detail || 'Login failed') + '</div>';
  }
});
</script>
</body>
</html>
