<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Product Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3 id="title">New Product</h3>
    <form id="productForm">
      <input type="hidden" id="productId" />
      <div class="mb-3"><label>Name</label><input id="name" class="form-control" required/></div>
      <div class="mb-3"><label>Category</label><input id="category" class="form-control"/></div>
      <div class="mb-3"><label>Price</label><input id="price" type="number" step="0.01" class="form-control" required/></div>
      <div class="mb-3"><label>Stock</label><input id="stock" type="number" class="form-control" required/></div>
      <div class="mb-3"><label>Weight</label><input id="weight" step="0.01" class="form-control"/></div>
      <div class="mb-3"><label>Description</label><textarea id="description" class="form-control"></textarea></div>
      <div class="mb-3"><label>Image</label><input id="image" type="file" class="form-control"/></div>
      <button class="btn btn-primary">Save</button>
      <a href="/admin/products/" class="btn btn-secondary">Cancel</a>
    </form>
  </div>

<script>
const q = new URLSearchParams(location.search);
const id = q.get('id');

if(id){
  document.getElementById('title').innerText = 'Edit Product';
  fetch('/api/products/' + id + '/').then(r=>r.json()).then(p => {
    document.getElementById('productId').value = p.id;
    document.getElementById('name').value = p.name;
    document.getElementById('category').value = p.category;
    document.getElementById('price').value = p.price;
    document.getElementById('stock').value = p.stock;
    document.getElementById('weight').value = p.weight;
    document.getElementById('description').value = p.description;
  });
}

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = localStorage.getItem('access');
  const form = new FormData();
  form.append('name', document.getElementById('name').value);
  form.append('category', document.getElementById('category').value);
  form.append('price', document.getElementById('price').value);
  form.append('stock', document.getElementById('stock').value);
  form.append('weight', document.getElementById('weight').value);
  form.append('description', document.getElementById('description').value);
  const imageFile = document.getElementById('image').files[0];
  if(imageFile) form.append('images', imageFile);
  const pid = document.getElementById('productId').value;
  const method = pid ? 'PUT' : 'POST';
  const url = pid ? '/api/products/' + pid + '/' : '/api/products/';
  const res = await fetch(url, {
    method,
    headers: { 'Authorization': 'Bearer ' + token },
    body: form
  });
  if (res.ok) window.location = '/admin/products/';
  else {
    const err = await res.json(); alert(JSON.stringify(err));
  }
});
</script>
</body>
</html>
